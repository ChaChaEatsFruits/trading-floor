name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uvx ruff@0.14.0 check .
      - name: Test
        # traders.py builds an OpenAI client at import; the tests never call the API, so a placeholder key is enough
        env:
          OPENAI_API_KEY: placeholder-not-a-real-key
        run: uv run --frozen pytest -q
